# BE 品質チェック (再利用ワークフロー)
# JUnit / JaCoCo / Javadoc / Checkstyle / SpotBugs
# 出力する Artifact: pages-be-{tests,jacoco,javadoc,checkstyle,spotbugs} と ci-summary-be
name: BE Quality

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 14

jobs:
  be:
    name: BE
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: be
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # テストが失敗しても JaCoCo レポートまで作り、合否は Quality gate で判定する
      - name: Test (JUnit + JaCoCo)
        continue-on-error: true
        run: mvn -B -ntp verify -Dmaven.test.failure.ignore=true

      - name: Javadoc
        continue-on-error: true
        run: |
          mkdir -p target
          mvn -B -ntp javadoc:javadoc 2>&1 | tee target/javadoc.log

      - name: Checkstyle
        continue-on-error: true
        run: mvn -B -ntp checkstyle:check

      - name: SpotBugs
        continue-on-error: true
        run: mvn -B -ntp spotbugs:check

      - name: Fetch develop baseline (coverage diff)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: .
        run: python3 .github/scripts/pages_site.py fetch --dest baseline --slots be-jacoco

      - name: Summarize (job summary / annotations)
        if: always()
        working-directory: .
        run: python3 .github/scripts/ci_report.py be --target be/target --out out --baseline baseline

      - name: Upload pages-be-tests
        if: always() && hashFiles('out/pages/be-tests/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pages-be-tests
          path: out/pages/be-tests
          retention-days: ${{ inputs.retention-days }}

      - name: Upload pages-be-jacoco
        if: always() && hashFiles('out/pages/be-jacoco/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pages-be-jacoco
          path: out/pages/be-jacoco
          retention-days: ${{ inputs.retention-days }}

      - name: Upload pages-be-javadoc
        if: always() && hashFiles('out/pages/be-javadoc/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pages-be-javadoc
          path: out/pages/be-javadoc
          retention-days: ${{ inputs.retention-days }}

      - name: Upload pages-be-checkstyle
        if: always() && hashFiles('out/pages/be-checkstyle/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pages-be-checkstyle
          path: out/pages/be-checkstyle
          retention-days: ${{ inputs.retention-days }}

      - name: Upload pages-be-spotbugs
        if: always() && hashFiles('out/pages/be-spotbugs/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pages-be-spotbugs
          path: out/pages/be-spotbugs
          retention-days: ${{ inputs.retention-days }}

      # PR コメントからリンクする画面 (1 ファイル完結の HTML)。圧縮せずに上げるとブラウザでそのまま開ける
      - name: Upload view be-tests.html
        if: always() && hashFiles('out/report/be-tests.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: out/report/be-tests.html
          archive: false
          retention-days: ${{ inputs.retention-days }}

      - name: Upload view be-jacoco.html
        if: always() && hashFiles('out/report/be-jacoco.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: out/report/be-jacoco.html
          archive: false
          retention-days: ${{ inputs.retention-days }}

      - name: Upload view be-javadoc.html
        if: always() && hashFiles('out/report/be-javadoc.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: out/report/be-javadoc.html
          archive: false
          retention-days: ${{ inputs.retention-days }}

      - name: Upload view be-checkstyle.html
        if: always() && hashFiles('out/report/be-checkstyle.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: out/report/be-checkstyle.html
          archive: false
          retention-days: ${{ inputs.retention-days }}

      - name: Upload view be-spotbugs.html
        if: always() && hashFiles('out/report/be-spotbugs.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: out/report/be-spotbugs.html
          archive: false
          retention-days: ${{ inputs.retention-days }}

      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-be
          path: out/summary
          retention-days: 7

      - name: Quality gate
        if: always()
        working-directory: .
        run: python3 .github/scripts/ci_report.py gate out/summary/be.json
