# Docs ビルド (再利用ワークフロー) — MkDocs Material
name: Docs Build

on:
  workflow_call:

jobs:
  docs:
    name: Docs (MkDocs)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: MkDocs build
        id: build
        continue-on-error: true
        run: mkdocs build --strict

      - name: Summarize
        if: always()
        working-directory: .
        run: |
          python3 .github/scripts/summarize.py docs "${{ steps.build.outcome }}" docs/site out/docs
          cat out/docs/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-report
          path: out/docs
          retention-days: 14

      - name: Quality gate
        if: always()
        working-directory: .
        run: python3 .github/scripts/summarize.py gate out/docs/summary.json
