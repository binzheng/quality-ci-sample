# Docs ビルド (再利用ワークフロー) — Docusaurus
# Pages の /docs/ に載せるため、BASE_URL を「Pages のパス + docs/」にしてビルドする
# 出力する Artifact: pages-docs と ci-summary-docs
name: Docs Build

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 14

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: docs
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Resolve Pages base path
        id: base
        run: |
          # Pages の URL (例: https://owner.github.io/repo/) からパス部分を取る。未設定ならリポジトリ名から推定
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          if [ -n "$url" ]; then
            path=$(echo "$url" | sed -E 's#^https?://[^/]+##')
          else
            owner=${GITHUB_REPOSITORY%%/*}; repo=${GITHUB_REPOSITORY#*/}
            if [ "$repo" = "${owner,,}.github.io" ]; then path=/; else path="/$repo/"; fi
          fi
          case "$path" in */) ;; *) path="$path/" ;; esac
          echo "site_url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "base_url=${path}docs/" >> "$GITHUB_OUTPUT"
          echo "BASE_URL=${path}docs/"

      - name: Docusaurus build
        id: build
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.base.outputs.base_url }}
          SITE_URL: ${{ steps.base.outputs.site_url }}
        run: npm run build

      - name: Summarize
        if: always()
        working-directory: .
        run: python3 .github/scripts/ci_report.py docs --outcome "${{ steps.build.outcome }}" --build docs/build --out out

      - name: Upload pages-docs
        if: always() && hashFiles('out/pages/docs/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pages-docs
          path: out/pages/docs
          retention-days: ${{ inputs.retention-days }}

      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-docs
          path: out/summary
          retention-days: 7

      - name: Quality gate
        if: always()
        working-directory: .
        run: python3 .github/scripts/ci_report.py gate out/summary/docs.json
