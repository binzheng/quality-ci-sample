# develop の CI 完了後に、各枠の最新 Artifact (pages-<枠>) を集めて GitHub Pages へ配備する
#
#   /                  索引 (ダッシュボード) と site.json
#   /be/<レポート>/    tests, jacoco, javadoc, checkstyle, spotbugs
#   /fe/<pkg>/<レポート>/  vitest (+coverage/), storybook, eslint, audit, sloc
#   /docs/             Docusaurus
#   /ci-metrics/       gh-pages ブランチにあれば取り込む
#
# 走らなかったジョブの枠は、その枠を最後に出した develop の実行の Artifact を使うので消えない。
# workflow_run はデフォルトブランチのこのファイルで動く (デフォルトブランチ = develop を前提)。
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Assemble & deploy
    # PR の実行は対象外 (develop への push・定期実行・手動実行のみ)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_BUDGET_MB: 950
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Fetch latest develop artifacts (per slot)
        run: python3 .github/scripts/pages_site.py fetch --dest staging --branch develop

      - name: Import ci-metrics from gh-pages (if any)
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            git archive FETCH_HEAD ci-metrics 2>/dev/null | tar -x -C site || echo "ci-metrics なし"
          fi

      - name: Assemble site
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_WORKFLOW_FILE: ci.yml
        run: python3 .github/scripts/pages_site.py assemble --staging staging --site site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
