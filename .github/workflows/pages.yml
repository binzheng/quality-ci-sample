# develop へのマージ (push) 時に品質レポートと Docs を GitHub Pages へ公開する
#   /          ポータル (各レポートへのリンクと品質ゲート結果)
#   /fe/       FE レポート (ESLint / Vitest / Coverage / Storybook / npm audit / SLOC)
#   /be/       BE レポート (JUnit / JaCoCo / Javadoc / Checkstyle / SpotBugs)
#   /docs/     MkDocs ドキュメント
name: Publish Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fe:
    uses: ./.github/workflows/fe-quality.yml

  be:
    uses: ./.github/workflows/be-quality.yml

  docs:
    uses: ./.github/workflows/docs-build.yml

  deploy:
    name: Deploy to GitHub Pages
    needs: [fe, be, docs]
    # 品質ゲート不合格でもレポート自体は公開する
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-report"
          path: artifacts

      - name: Assemble site
        run: |
          mkdir -p site
          if [ -d artifacts/fe-report ]; then cp -r artifacts/fe-report site/fe; fi
          if [ -d artifacts/be-report ]; then cp -r artifacts/be-report site/be; fi
          if [ -d artifacts/docs-report/site ]; then cp -r artifacts/docs-report/site site/docs; fi
          if [ -f artifacts/docs-report/summary.json ]; then cp artifacts/docs-report/summary.json site/docs-summary.json; fi
          python3 .github/scripts/summarize.py portal site
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
