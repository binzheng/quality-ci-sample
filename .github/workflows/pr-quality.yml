# PR 作成/更新時に FE・BE・Docs の品質チェックを実行し、結果を PR 画面に表示する
#  - PR コメント (固定コメントを毎回上書き)
#  - Checks タブ (テスト結果: dorny/test-reporter)
#  - 各ジョブの Summary
name: PR Quality Check

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fe:
    uses: ./.github/workflows/fe-quality.yml

  be:
    uses: ./.github/workflows/be-quality.yml

  docs:
    uses: ./.github/workflows/docs-build.yml

  comment:
    name: PR comment
    needs: [fe, be, docs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-report"
          path: reports

      - name: Build comment
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/summarize.py comment comment.md \
            reports/fe-report/summary.md reports/be-report/summary.md reports/docs-report/summary.md

      - name: Post / update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-report
          path: comment.md
